name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test & Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-24.04
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
          - target: macos-aarch64
            runner: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Odin
        uses: laytan/setup-odin@v2
        with:
          release: dev-2026-11a
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests
        run: odin test tests

      - name: Build release binary
        run: |
          if [ "$(uname -s)" = "Darwin" ]; then
            odin build src -o:speed -disable-assert -minimum-os-version:11.0 -out:otfx
            LC_VER="$(otool -l otfx | grep -A4 LC_BUILD_VERSION)"
            printf '%s\n' "${LC_VER}"
            printf '%s\n' "${LC_VER}" | grep -Eq '^[[:space:]]*minos 11\.0$'
            codesign -v otfx
          else
            odin build src -o:speed -disable-assert -out:otfx
          fi

      - name: Smoke test CLI
        run: |
          ./otfx --version
          printf 'hello\nworld\n' | COLUMNS=80 LINES=24 ./otfx --seed 42 --frame-rate 0 --max-frames 4 decrypt >/dev/null
