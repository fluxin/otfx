name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-24.04
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
          - target: macos-aarch64
            runner: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Odin
        uses: laytan/setup-odin@v2
        with:
          release: dev-2026-11a
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests
        run: odin test tests

      - name: Package release archive
        env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          VERSION="${TAG#v}"
          if [ "$(uname -s)" = "Darwin" ]; then
            odin build src -o:speed -disable-assert -minimum-os-version:11.0 -define:OTFX_VERSION="${VERSION}" -out:otfx
            strip -x otfx
            codesign -v otfx
            LC_VER="$(otool -l otfx | grep -A4 LC_BUILD_VERSION)"
            printf '%s\n' "${LC_VER}"
            printf '%s\n' "${LC_VER}" | grep -Eq '^[[:space:]]*minos 11\.0$'
          else
            odin build src -o:speed -disable-assert -define:OTFX_VERSION="${VERSION}" -out:otfx
            strip otfx
          fi
          ./otfx --version
          printf 'otfx\n' | COLUMNS=80 LINES=24 ./otfx --seed 1 --frame-rate 0 wipe >/dev/null

          STAGE="otfx-${TAG}-${TARGET}"
          mkdir -p "dist/${STAGE}"
          cp otfx LICENSE README.md "dist/${STAGE}/"
          if [ "$(uname -s)" = "Darwin" ]; then
            COPYFILE_DISABLE=1 tar -C dist -czf "dist/${STAGE}.tar.gz" "${STAGE}"
          else
            tar -C dist -czf "dist/${STAGE}.tar.gz" "${STAGE}"
          fi
          if tar -tzf "dist/${STAGE}.tar.gz" | grep -Eq '(^|/)\._'; then
            echo "Error: AppleDouble (._*) files found in archive" >&2
            exit 1
          fi

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Compute SHA256SUMS
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS.txt
